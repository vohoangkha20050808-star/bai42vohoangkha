<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>TK5: Accordion đơn giản</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .accordion {
            background-color: #eee;
            color: #444;
            cursor: pointer;
            padding: 18px;
            width: 100%;
            text-align: left;
            border: none;
            outline: none;
            font-size: 16px;
            transition: 0.4s;
            font-weight: bold;
        }
        .active, .accordion:hover { background-color: #ccc; }
        .panel {
            padding: 0 18px;
            background-color: white;
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease-out;
            border: 1px solid #eee;
        }
    </style>
</head>
<body>
    <h2>Bài tập TK5: Accordion đơn giản</h2>
    <button class="accordion">Tiêu đề Accordion 1</button>
    <div class="panel">
        <p>Đây là nội dung chi tiết bên trong phần tử Accordion 1. Khi bấm vào tiêu đề, phần nội dung này sẽ trượt lên hoặc trượt xuống mượt mà nhờ CSS transition.</p>
    </div>

    <button class="accordion">Tiêu đề Accordion 2</button>
    <div class="panel">
        <p>Nội dung của accordion số 2 với hiệu ứng trượt sử dụng classList.toggle() và max-height.</p>
    </div>

    <script>
        const acc = document.getElementsByClassName("accordion");
        for (let i = 0; i < acc.length; i++) {
            acc[i].addEventListener("click", function() {
                this.classList.toggle("active");
                const panel = this.nextElementSibling;
                if (panel.style.maxHeight) {
                    panel.style.maxHeight = null;
                } else {
                    panel.style.maxHeight = panel.scrollHeight + "px";
                }
            });
        }
    </script>
</body>
</html>
