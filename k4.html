<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>K4: Phân Trang Danh Sách</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .container { max-width: 400px; }
        ul { padding-left: 20px; }
        li { padding: 4px 0; }
        .pagination { margin-top: 15px; }
        .pagination button { padding: 5px 10px; margin-right: 5px; cursor: pointer; border: 1px solid #ccc; background: #fff; }
        .pagination button.active { background: #2b50ed; color: white; border-color: #2b50ed; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Bài tập K4: Phân Trang Danh Sách</h2>
        <ul id="itemList"></ul>
        <div class="pagination" id="paginationControls"></div>
    </div>

    <script>
        // Tạo danh sách 50 mục dữ liệu giả lập
        const items = Array.from({ length: 50 }, (_, i) => `Mục dữ liệu số ${i + 1}`);
        const itemsPerPage = 10;
        let currentPage = 1;

        function displayList(page) {
            const listEl = document.getElementById('itemList');
            listEl.innerHTML = '';
            
            const start = (page - 1) * itemsPerPage;
            const end = start + itemsPerPage;
            const paginatedItems = items.slice(start, end);

            paginatedItems.forEach(item => {
                const li = document.createElement('li');
                li.textContent = item;
                listEl.appendChild(li);
            });
        }

        function setupPagination() {
            const paginationEl = document.getElementById('paginationControls');
            paginationEl.innerHTML = '';
            const pageCount = Math.ceil(items.length / itemsPerPage);

            for (let i = 1; i <= pageCount; i++) {
                const btn = document.createElement('button');
                btn.textContent = i;
                if (i === currentPage) btn.classList.add('active');
                
                btn.addEventListener('click', function() {
                    currentPage = i;
                    displayList(currentPage);
                    
                    document.querySelectorAll('.pagination button').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                });
                
                paginationEl.appendChild(btn);
            }
        }

        // Khởi chạy ban đầu
        displayList(currentPage);
        setupPagination();
    </script>
</body>
</html>
